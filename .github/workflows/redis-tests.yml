name: Redis tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Build server
        run: bash ./build.sh

      - name: Start server and run implemented tests
        shell: bash
        run: |
          set -euo pipefail

          ./redis-server >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          python3 - <<'PY'
          import socket
          import time

          for _ in range(40):
              try:
                  with socket.create_connection(("127.0.0.1", 6379), timeout=0.25):
                      break
              except OSError:
                  time.sleep(0.25)
          else:
              raise SystemExit("Redis server did not start; see server.log")
          PY

          for step in 2 3 4 5 6 7; do
              python3 redis_tests.py --step "$step"
          done